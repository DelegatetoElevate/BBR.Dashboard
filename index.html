<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>BBR Dashboard</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --card: #ffffff;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --wash: rgba(11,11,11,0.04);
  --accent: #2a78d6;
  --s-online: #2a78d6;
  --s-claremont: #eb6834;
  --s-jolimont: #1baf7a;
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --bad-text: #b32d2d;
  --funnel-1: #1c5cab;
  --funnel-2: #2a78d6;
  --funnel-3: #5598e7;
  --funnel-4: #86b6ef;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --card: #1a1a19;
    --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --accent: #3987e5; --s-online: #3987e5; --s-claremont: #d95926; --s-jolimont: #199e70;
    --good-text: #0ca30c; --bad-text: #e66767;
    --funnel-1: #86b6ef; --funnel-2: #5598e7; --funnel-3: #3987e5; --funnel-4: #256abf;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --card: #1a1a19;
  --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --accent: #3987e5; --s-online: #3987e5; --s-claremont: #d95926; --s-jolimont: #199e70;
  --good-text: #0ca30c; --bad-text: #e66767;
  --funnel-1: #86b6ef; --funnel-2: #5598e7; --funnel-3: #3987e5; --funnel-4: #256abf;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Poppins", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page); color: var(--ink); font-size: 14px; line-height: 1.45;
}
button, input, select { font: inherit; color: inherit; }
header.top {
  position: sticky; top: 0; z-index: 10; background: var(--page);
  border-bottom: 1px solid var(--border);
}
.top-inner { max-width: 1280px; margin: 0 auto; padding: 14px 24px 0; }
.title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.title-row h1 { font-size: 17px; margin: 0; font-weight: 600; letter-spacing: 0.01em; }
.title-row .sub { color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.titles { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.titles .meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.titles .badge { font-size: 11.5px; padding: 1px 8px; }
.spacer { flex: 1; }
.badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
  padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink-2);
}
.badge.sample { background: rgba(250,178,25,0.16); color: var(--ink); border-color: rgba(250,178,25,0.5); }
nav.tabs { display: flex; gap: 2px; margin-top: 12px; overflow-x: auto; }
nav.tabs button {
  border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--ink-2);
  border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500;
}
nav.tabs button:hover { color: var(--ink); background: var(--wash); }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
main { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }
.filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.filters label { font-size: 12px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
.seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 0; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--page); font-weight: 500; }
select, input[type="text"], input[type="number"], input[type="date"], input[type="search"] {
  background: var(--card); border: 1px solid var(--border); border-radius: 0; padding: 6px 10px; min-height: 34px;
}
/* Buttons follow bodiesbyryan.com.au: square, black, small uppercase labels */
.btn {
  border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 0; padding: 8px 16px; cursor: pointer;
  font-size: 12.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; transition: background .15s, color .15s;
}
.btn:hover { background: var(--ink); color: var(--page); }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--page); }
.btn.primary:hover { background: transparent; color: var(--ink); }
.btn:focus-visible, .pill:focus-visible, .seg button:focus-visible, nav.tabs button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.grid { display: grid; gap: 14px; }
.g-tiles { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.g-2 { grid-template-columns: 2fr 1fr; }
.g-2e { grid-template-columns: 1fr 1fr; }
@media (max-width: 900px) { .g-2, .g-2e { grid-template-columns: 1fr; } }
.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 0; padding: 18px 20px; min-width: 0;
}
.card h2 { font-size: 14px; margin: 0 0 2px; font-weight: 600; }
.card .hint { color: var(--muted); font-size: 12px; margin: 0 0 12px; }
.section-gap { height: 14px; }
.tile .label { color: var(--ink-2); font-size: 12.5px; }
.tile .value { font-size: 26px; font-weight: 600; margin: 4px 0 2px; }
.tile .delta { font-size: 12.5px; color: var(--ink-2); }
.hero .value { font-size: 48px; line-height: 1.05; }
.up { color: var(--good-text); }
.down { color: var(--bad-text); }
.meter { height: 8px; border-radius: 999px; background: var(--grid); overflow: hidden; margin-top: 8px; }
.meter > span { display: block; height: 100%; border-radius: 999px; background: var(--ink); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
th { color: var(--ink-2); font-weight: 600; font-size: 12px; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tbody tr:hover { background: var(--wash); }
.table-wrap { overflow-x: auto; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px;
  border-radius: 999px; border: 1px solid var(--border); white-space: nowrap;
}
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
/* Notification colours: payments red, Slack magenta, transfers green, upcoming blue, offers amber */
:root { --n-payment: #d03b3b; --n-slack: #d1338a; --n-transfer: #12935a; --n-upcoming: #2a78d6; --n-offer: #d99a06; --n-change: #6b4fd1; }
:root[data-theme="dark"] { --n-payment: #e66767; --n-slack: #e45aa8; --n-transfer: #2fb877; --n-upcoming: #3f8fe8; --n-offer: #f0b429; --n-change: #9d86f0; }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) { --n-payment: #e66767; --n-slack: #e45aa8; --n-transfer: #2fb877; --n-upcoming: #3f8fe8; --n-offer: #f0b429; --n-change: #9d86f0; } }
.notif {
  --nc: var(--accent); display: flex; gap: 12px; padding: 12px 14px; margin-bottom: 10px;
  border-left: 3px solid var(--nc); background: color-mix(in srgb, var(--nc) 7%, transparent);
}
.notif:last-child { margin-bottom: 0; }
.notif.n-payment { --nc: var(--n-payment); } .notif.n-slack { --nc: var(--n-slack); } .notif.n-transfer { --nc: var(--n-transfer); }
.notif.n-upcoming { --nc: var(--n-upcoming); } .notif.n-offer { --nc: var(--n-offer); } .notif.n-change { --nc: var(--n-change); }
.notif.n-ready { --nc: var(--n-transfer); }
/* Period comparison strip */
.period-strip .ps-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.period-strip .ps-head .muted { font-size: 12px; }
.ps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px 18px; }
.ps-item .label { color: var(--ink-2); font-size: 12px; }
.ps-item .value { font-size: 22px; font-weight: 600; margin: 2px 0; }
.ps-item .delta { font-size: 11.5px; color: var(--ink-2); }
/* Onboarding checklist */
.ob-steps { display: flex; flex-wrap: wrap; gap: 4px; min-width: 260px; }
.ob-step { font: inherit; font-size: 11.5px; border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; background: transparent; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
.ob-step:hover { border-color: var(--ink); color: var(--ink); }
.ob-step.done { background: var(--ink); border-color: var(--ink); color: var(--page); }
.ob-step.ready { border-color: var(--n-transfer); color: var(--n-transfer); }
.ob-step[aria-disabled="true"] { opacity: .45; }
.ob-macros { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
.vip-chip { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; border: 1px solid var(--ink); padding: 0 5px; border-radius: 999px; }
.vault-name { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12.5px; margin: 4px 0 8px; }
.vault-name code { background: var(--wash); padding: 3px 8px; font-size: 12.5px; }
.check-line { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 10px 0; }
.check-line input { width: auto; margin: 0; }
/* Check-ins */
.pc-meet { font-size: 12.5px; margin: 6px 0; padding: 6px 8px; background: var(--wash); }
.pc-ck { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; margin: 6px 0; flex-wrap: wrap; }
.ck-ok { color: var(--good-text); } .ck-miss { color: var(--n-risk); }
.light.sm { width: 16px; height: 16px; }
#view td .mini-btn, .pc-ck .mini-btn { white-space: nowrap; }
td.wrap-cell { white-space: normal; min-width: 160px; max-width: 280px; font-size: 12.5px; }
.type-chip { display: inline-block; font-size: 11.5px; padding: 1px 8px; border: 1px solid currentColor; border-radius: 999px; white-space: nowrap; }
.type-termination { color: var(--n-payment); } .type-open { color: var(--muted); } .type-freeze { color: var(--n-upcoming); } .type-pause { color: var(--n-change); } .type-program_end { color: var(--ink-2); }
.month-row td { background: var(--wash); font-weight: 600; font-size: 12px; color: var(--ink-2); }
.notif .ico { background: var(--nc) !important; }
.notif.n-offer .ico { color: #0b0b0b; }
.n-head, .n-item { font: inherit; color: inherit; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; text-decoration: none; }
.n-head { font-weight: 600; font-size: 13px; display: inline-flex; gap: 6px; align-items: baseline; }
.n-head:hover { color: var(--nc); }
.n-item { display: flex; gap: 6px; width: 100%; color: var(--ink-2); font-size: 12.5px; padding: 3px 0; }
.n-item .go { margin-left: auto; color: var(--nc); flex: none; }
.n-item:hover { color: var(--ink); } .n-item:hover .txt { text-decoration: underline; text-decoration-color: var(--nc); }
.n-head:focus-visible, .n-item:focus-visible, .ig:focus-visible { outline: 2px solid var(--nc, var(--ink)); outline-offset: 2px; }
.ig { color: var(--ink); text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 3px; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
.flash { animation: flash 1.8s ease-out; }
/* v2: tab dot, sales, bookings, check-ins */
:root { --n-risk: #e8590c; --orange: #f08c00; }
.notif.n-risk { --nc: var(--n-risk); }
nav.tabs button { position: relative; }
.tab-dot { position: relative; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--axis); margin-left: 7px; vertical-align: 2px; }
.tab-dot.on { background: var(--orange); }
.tab-dot.on::before, .tab-dot.on::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: var(--orange); animation: dot-ping 1.8s cubic-bezier(0, 0, 0.2, 1) infinite; }
.tab-dot.on::after { animation-delay: 0.9s; }
@keyframes dot-ping { 0% { transform: scale(1); opacity: 0.7; } 100% { transform: scale(3.2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .tab-dot.on::before, .tab-dot.on::after { animation: none; opacity: 0; } }
.tab-sub-h { font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin: 4px 0 12px; }
.mini-btn { font: inherit; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; padding: 3px 8px; border: 1px solid var(--border); background: transparent; color: var(--ink-2); cursor: pointer; }
.mini-btn:hover { border-color: var(--ink); color: var(--ink); }
.mini-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.est { font-size: 11px; color: var(--muted); font-style: italic; }
.warn-amber { color: var(--ink-2); }
.this-month { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--page); background: var(--ink); padding: 1px 6px; margin-left: 6px; }
.pc-toggle { font: inherit; font-weight: 600; background: none; border: 0; padding: 0; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.pc-toggle::before { content: "▸"; font-size: 11px; transition: transform .15s; }
.pc-toggle[aria-expanded="true"]::before { transform: rotate(90deg); }
.pc-month[data-open="false"] .pc-row { display: none; }
.pc-row td { background: var(--wash); }
.pc-name { font-weight: 500; } .pc-sub { font-size: 12px; color: var(--muted); }
.day-group { margin-top: 10px; } .day-head { font-size: 12px; font-weight: 600; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.05em; padding: 6px 0; border-bottom: 1px solid var(--grid); }
table.up-calls { table-layout: fixed; }
table.up-calls td, table.up-calls th { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.up-calls tr.day-row th { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); padding-top: 18px; background: none; border-bottom: 1px solid var(--axis); }
table.up-calls tbody:first-of-type tr.day-row th { padding-top: 8px; }
@media (max-width: 700px) { table.up-calls { table-layout: auto; } }
.week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.week-day { border: 1px solid var(--grid); padding: 8px 10px; } .week-day.today { border-color: var(--ink); }
.ck-chip { display: flex; align-items: center; gap: 6px; width: 100%; font: inherit; font-size: 12.5px; text-align: left; background: none; border: 0; padding: 4px 0; color: var(--ink); cursor: pointer; }
.ck-chip:hover { text-decoration: underline; }
details.more summary { cursor: pointer; font-size: 12px; color: var(--ink-2); padding: 4px 0; }
.pulse-tile { text-align: left; font: inherit; color: inherit; cursor: pointer; border-bottom: 3px solid var(--lc); }
.pulse-tile[aria-pressed="true"] { outline: 2px solid var(--lc); outline-offset: -2px; }
.pulse-h { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--lc); border-bottom: 1px solid var(--lc); padding-bottom: 8px; margin: 0 0 12px; scroll-margin-top: 140px; }
.pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.pulse-card { border: 1px solid var(--border); background: var(--card); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.pulse-card.p-at_risk { border-color: color-mix(in srgb, var(--n-payment) 60%, transparent); background: color-mix(in srgb, var(--n-payment) 6%, var(--card)); }
.pulse-card.p-watch { border-color: color-mix(in srgb, var(--n-offer) 50%, transparent); }
.pc-top { display: flex; justify-content: space-between; gap: 10px; }
.pc-title { font-weight: 600; font-size: 15px; } .pc-meta { font-size: 12.5px; color: var(--ink-2); } .pc-ig { font-size: 12.5px; margin-top: 2px; }
.pc-note { font-size: 13px; background: var(--wash); padding: 8px 10px; overflow-wrap: anywhere; }
.pc-foot { font-size: 12px; color: var(--muted); margin-top: auto; } .pc-foot.stale { color: var(--n-risk); }
.light { width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--lc); cursor: pointer; flex: none; box-shadow: inset 0 -3px 6px rgba(0,0,0,0.25); }
.light:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.pulse-pick { border: 0; padding: 0; margin: 14px 0 0; display: flex; gap: 8px; flex-wrap: wrap; }
.pp input { position: absolute; opacity: 0; } .pp span { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); padding: 8px 14px; cursor: pointer; font-size: 13px; }
.pp input:checked + span { border-color: var(--lc); background: color-mix(in srgb, var(--lc) 12%, transparent); font-weight: 600; }
.pp input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
@media (max-width: 600px) { .actions label { margin-left: 0 !important; } }
/* Clients */
.client-link { font: inherit; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; font-weight: 500; text-align: left; text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 3px; }
.client-link:hover { text-decoration-color: var(--ink); }
.client-link:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
tr.client-row { cursor: pointer; }
.dialog.wide { width: min(900px, 100%); }
.client-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid var(--grid); }
.kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px 20px; padding: 14px 0; }
.kv .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.kv .v { font-size: 13.5px; margin-top: 2px; }
.sub-h { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin: 18px 0 8px; padding-top: 14px; border-top: 1px solid var(--grid); }
.note { border-left: 2px solid var(--ink); padding: 8px 12px; margin-top: 10px; background: var(--wash); }
.note-meta { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-2); flex-wrap: wrap; }
.note-kind { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid currentColor; border-radius: 999px; padding: 0 7px; }
.note-text { font-size: 13.5px; margin-top: 4px; white-space: normal; overflow-wrap: anywhere; }
/* Monday meeting banner */
.meeting { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px 20px; margin-bottom: 16px; border: 1px solid var(--ink); background: var(--card); }
.meeting .m-ico { width: 40px; height: 40px; border: 1px solid currentColor; border-radius: 50%; display: grid; place-items: center; flex: none; }
.meeting .m-body { flex: 1; min-width: 220px; }
.meeting .m-title { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.meeting .m-when { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.meeting .m-tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding: 2px 8px; border: 1px solid currentColor; border-radius: 999px; }
.meeting.today, .meeting.live { background: var(--ink); color: var(--page); border-color: var(--ink); }
.meeting.today .m-when, .meeting.live .m-when { color: color-mix(in srgb, var(--page) 78%, transparent); }
.meeting.today .btn.primary, .meeting.live .btn.primary { background: var(--page); color: var(--ink); border-color: var(--page); }
.meeting.today .btn.primary:hover, .meeting.live .btn.primary:hover { background: transparent; color: var(--page); }
.meeting .btn.primary { padding: 12px 20px; text-decoration: none; }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4d4d; display: inline-block; animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
.card { scroll-margin-top: 140px; }
@keyframes flash { 0%, 30% { box-shadow: 0 0 0 3px var(--ink); } 100% { box-shadow: 0 0 0 3px transparent; } }
@media (prefers-reduced-motion: reduce) { .flash { animation: none; outline: 3px solid var(--ink); } }
.notif .ico {
  width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
  font-size: 13px; font-weight: 700; flex: none; color: #fff;
}
.notif .t { font-weight: 600; font-size: 13px; }
.notif .d { color: var(--ink-2); font-size: 12.5px; }
.count { color: var(--muted); font-weight: 500; }
.toggle { position: relative; display: inline-block; vertical-align: middle; width: 36px; height: 20px; flex: none; }
.toggle input { opacity: 0; width: 100%; height: 100%; margin: 0; position: absolute; inset: 0; cursor: pointer; z-index: 1; }
.toggle span {
  position: absolute; inset: 0; border-radius: 999px; background: transparent; border: 1px solid var(--muted); transition: background .15s, border-color .15s; pointer-events: none;
}
.toggle span::after {
  content: ""; position: absolute; top: 50%; left: 3px; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s;
}
.toggle input:checked + span { background: var(--ink); border-color: var(--ink); }
.toggle input:checked + span::after { transform: translateX(16px); background: var(--page); }
.toggle input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 2px; }
td.toggle-cell { width: 64px; text-align: center; }
td.toggle-cell .toggle { margin: 0 auto; }
@media (prefers-reduced-motion: reduce) { .toggle span, .toggle span::after { transition: none; } }
.warn-text { color: var(--bad-text); font-size: 12px; }
.muted { color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.tip {
  position: fixed; pointer-events: none; z-index: 50; background: var(--card); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); display: none; max-width: 260px;
}
.tip .tr { display: flex; justify-content: space-between; gap: 14px; }
.tip .tr span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
svg text { fill: var(--muted); font-size: 11px; font-family: inherit; }
details.tv summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; margin-top: 8px; }
.empty { color: var(--muted); padding: 18px 0; text-align: center; }
footer { max-width: 1280px; margin: 0 auto; padding: 0 24px 40px; color: var(--muted); font-size: 12px; }
.hidden { display: none !important; }
/* Pill = the site's round outlined icon buttons; primary = its black call-to-action */
.pill {
  border: 1px solid var(--ink); background: transparent; color: var(--ink); border-radius: 999px; padding: 8px 16px;
  cursor: pointer; font-size: 12.5px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em;
  display: inline-flex; align-items: center; gap: 6px; transition: background .15s, color .15s;
}
.pill:hover { background: var(--ink); color: var(--page); }
.pill.primary { background: var(--ink); border-color: var(--ink); color: var(--page); border-radius: 0; padding: 10px 18px; }
.pill.primary:hover { background: transparent; color: var(--ink); }

.logo.lg { width: 72px; height: 72px; margin-bottom: 10px; }
:root[data-theme="dark"] .logo { filter: invert(1); }
.logo.globe { animation: globe-spin 8s linear infinite; }
@keyframes globe-spin { from { transform: perspective(400px) rotateY(0deg); } to { transform: perspective(400px) rotateY(360deg); } }
@media (prefers-reduced-motion: reduce) { .logo.globe { animation: none; } }
@media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) .logo { filter: invert(1); } }
.menu-wrap { position: relative; }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--border);
  border-radius: 0; box-shadow: 0 8px 24px rgba(0,0,0,0.14); padding: 6px; min-width: 220px; z-index: 30;
}
.menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 0; cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--wash); }
.menu .mhint { font-size: 11.5px; color: var(--muted); padding: 4px 10px 6px; }
.user-chip { font-size: 12.5px; color: var(--ink-2); }

<script>
/* =====================================================================
   BBR Sales Dashboard
   ---------------------------------------------------------------------
   Data: the page loads ./data.json if it exists (see README for the
   schema). If not, it builds SAMPLE data so the layout can be reviewed.
   Sign-in: name + access code. The admin code shows every tab; the outreach
   code shows the Sales tab, where they can add leads and calls. Checked in
   the browser, so it is NOT real security. Put real logins in front of the
   site before using real data.
   ===================================================================== */

const ACCOUNTS = [
  { id: "online",    name: "BBR New Sales",  short: "Online",    color: "var(--s-online)" },
  { id: "claremont", name: "BBR Claremont",  short: "Claremont", color: "var(--s-claremont)" },
  { id: "jolimont",  name: "BBR Jolimont",   short: "Jolimont",  color: "var(--s-jolimont)" }
];
const ACC = Object.fromEntries(ACCOUNTS.map(a => [a.id, a]));
const FEES = { late_cancel: 15, no_show: 30 };
const STATUS_LABEL = { active: "Active", suspended: "Suspended", terminated: "Terminated", free: "Free gym access" };
const NAME_RE = /^\s*(.+?)\s+[–—-]\s+(.+?)\s+[–—-]\s+(\d+)\s*\/\s*(\d+)\s*$/;
const LS_KEY = "bbr-dashboard-v1";
const ENTRY_KEY = "bbr-entries-v1";
const SESSION_KEY = "bbr-session-v1";

/* ACCESS CODES. One code per role. Only a SHA-256 hash of each code is kept here, so the
   codes can't be read from the page source, but the check still runs in the browser:
   treat it as a simple lock, not real security. To change a code, open the dashboard,
   run  await hashCode("NEW-CODE")  in the browser console and paste the result below.
   Codes ignore spaces, dashes and upper/lower case. */
const ACCESS = [
  { role: "admin",    label: "Admin",    hash: "18e0622d5160acf561d00bbf73c595a172c0d3fdfe11e82f60c0d9a6d78e596c" },
  { role: "outreach", label: "Outreach", hash: "2d70636438375c0549753a76bfae6e6f64d75cb0e27673c1e79cd69817163261" },
  { role: "coach",    label: "Coach",    hash: "ae708666cb9061c27ea1405ef8832cf2ad836a3d3dc579643ea952605f8d7e6e" }
];
const NAME_KEY = "bbr-name-v1";
const LEAD_SOURCES = ["Instagram Outbound", "Instagram Inbound", "Email", "Calendly", "Referral", "Google Calendar", "Walk-in", "Other"];
const INTERESTS = ["Gym membership", "Online coaching", "PT / custom program", "Not sure yet"];
const CALL_STATUS = { booked: "Booked", showed: "Showed up", no_show: "No-show", cancelled: "Cancelled", closed: "Signed up" };
const PAY_TYPES = { full: "Paid in full", instalments: "Instalments", recurring: "Recurring" };
const OFFER_TYPES = ["Gym membership", "Online program", "Custom program", "Challenge"];
const COACHES = ["Ryan", "Eva", "Sage"];
/* Weekly check-ins: form due Tuesday 12:00 pm Perth, 30-minute grace period; after that it counts for the next Tuesday */
const CHECKIN = { weekday: 2, deadline: 12 * 60, grace: 30 };
const ONBOARD_STEPS = [
  { k: "ghl", short: "GHL tag", label: "GoHighLevel tag \u201cBBR online program\u201d added" },
  { k: "vault", short: "Coach Vault", label: "Coach Vault set up, check-ins on Tuesdays" },
  { k: "meal", short: "Meal plan", label: "Meal plan done, macros recorded" },
  { k: "protocol", short: "Protocol", label: "Protocol uploaded to Coach Vault files" },
  { k: "review", short: "Ryan review", label: "Ryan reviewed the macros and built the training program" }
];
/* Weekly team meeting: every Monday 8:00 am Perth time (AWST, UTC+8, no daylight saving) */
const MEETING = { title: "Monday team meeting", url: "https://meet.google.com/weo-esoz-gxs?hs=224", weekday: 1, hour: 8, minute: 0, durationMin: 60, offsetMin: 480, tz: "Australia/Perth" };
const CHANGE_TYPES = { termination: "Termination", pause: "Pause", program_end: "Program ending" };
const NO_END = t => t === "termination" || t === "program_end";   // one date only
const CHANGE_LABEL = { ...CHANGE_TYPES, freeze: "Freeze" };   // older records may still say freeze
const CHANGE_WINDOW_DAYS = 14;   // notification window
const LOOKAHEAD_DAYS = 61;       // Clients tab list: about 2 months

/* ---------- small utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const aud = (n, d = 0) => (n < 0 ? "-" : "") + "$" + Math.abs(n).toLocaleString("en-AU", { minimumFractionDigits: d, maximumFractionDigits: d });
const compact = n => Math.abs(n) >= 1e6 ? "$" + (n / 1e6).toFixed(1) + "M" : Math.abs(n) >= 1e4 ? "$" + (n / 1e3).toFixed(1) + "K" : aud(n);
const pct = (a, b) => b ? (a / b) * 100 : null;
const fmtPct = v => v == null || !isFinite(v) ? "–" : v.toFixed(1) + "%";
const iso = d => { const z = new Date(d); z.setMinutes(z.getMinutes() - z.getTimezoneOffset()); return z.toISOString().slice(0, 10); };
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const z = new Date(d); z.setDate(z.getDate() + n); return z; };
const mondayOf = d => { const z = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const wd = (z.getDay() + 6) % 7; return addDays(z, -wd); };
const dShort = d => d.toLocaleDateString("en-AU", { day: "numeric", month: "short" });
const sum = (arr, f = x => x) => arr.reduce((s, x) => s + (Number(f(x)) || 0), 0);
function store() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } }
function save(patch) { try { localStorage.setItem(LS_KEY, JSON.stringify({ ...store(), ...patch })); } catch {} }
const todayIso = () => iso(new Date());
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- manual entries (leads, calls, sign-ups), saved in this browser ---------- */
function entries() {
  try {
    const e = JSON.parse(localStorage.getItem(ENTRY_KEY)) || {};
    return { leads: e.leads || [], calls: e.calls || [], signups: e.signups || [], changes: e.changes || [], notes: e.notes || [], pulse: e.pulse || [],
             callStatus: e.callStatus || {}, callEdits: e.callEdits || {}, signupEdits: e.signupEdits || {}, onboard: e.onboard || {}, checkins: e.checkins || [] };
  } catch { return { leads: [], calls: [], signups: [], changes: [], notes: [], pulse: [], callStatus: {}, callEdits: {}, signupEdits: {}, onboard: {}, checkins: [] }; }
}
function saveEntries(e) { try { localStorage.setItem(ENTRY_KEY, JSON.stringify(e)); } catch {} }
const isLocal = (kind, id) => entries()[kind].some(x => x.id === id);
const allLeads = () => [...DATA.leads, ...entries().leads];
const allSignups = () => { const e = entries(); return [...DATA.signups, ...e.signups].map(x => e.signupEdits[x.id] ? { ...x, ...e.signupEdits[x.id] } : x); };
/* Scheduled terminations, freezes and pauses, joined to the member record (by email, then name) */
function allChanges() {
  return [...DATA.changes, ...entries().changes].map(c => {
    const m = DATA.members.find(x => (c.email && x.email && x.email.toLowerCase() === c.email.toLowerCase()) || x.name.toLowerCase() === String(c.member || "").toLowerCase());
    return { ...c, m };
  });
}
function upcomingChanges(days) {
  const t = new Date(); t.setHours(0, 0, 0, 0); const end = addDays(t, days);
  return allChanges().filter(c => { const d = parse(c.start); return d >= t && d <= end && (acct() === "all" || !c.m || c.m.homeGym === acct()); })
    .sort((a, b) => a.start.localeCompare(b.start));
}
function tenure(since) {
  if (!since) return "";
  const d = parse(since), t = new Date();
  const months = (t.getFullYear() - d.getFullYear()) * 12 + t.getMonth() - d.getMonth() - (t.getDate() < d.getDate() ? 1 : 0);
  if (months < 1) return "new member";
  const y = Math.floor(months / 12), mo = months % 12;
  return [y ? y + (y === 1 ? " yr" : " yrs") : "", mo ? mo + (mo === 1 ? " mth" : " mths") : ""].filter(Boolean).join(" ");
}
function changeLength(c) {
  if (c.type === "termination") return "Ends membership";
  if (c.type === "program_end") return `Program ending on ${dayFmt(c.start)}`;
  if (!c.end) return "Open, no end date";
  const w = Math.max(1, Math.round((parse(c.end) - parse(c.start)) / 864e5 / 7));
  return `${w} ${w === 1 ? "week" : "weeks"}, to ${dShort(parse(c.end))}`;
}
function changeLost(c) {
  const m = c.m; if (!m || m.upfront || !m.price) return null;
  if (c.type === "termination") return { v: m.price * 26 / 12, per: "/ month" };
  if (c.type === "program_end") return null;
  if (!c.end) return { v: m.price, per: "/ fortnight" };
  const w = (parse(c.end) - parse(c.start)) / 864e5 / 7; return { v: (w / 2) * m.price, per: "total" };
}
function allCalls() {
  const e = entries();
  return [...DATA.calls, ...e.calls].map(c => { let x = e.callStatus[c.id] ? { ...c, status: e.callStatus[c.id] } : c; if (e.callEdits[c.id]) x = { ...x, ...e.callEdits[c.id] }; return x; });
}

/* ---------- client Instagram and source links ---------- */
const cleanIG = h => String(h || "").trim().replace(/^https?:\/\/(www\.)?(instagram\.com|ig\.me\/m)\//i, "").replace(/^@/, "").replace(/[/?#].*$/, "");
const igOk = h => /^[A-Za-z0-9._]{1,30}$/.test(h);
function igFor(client) {
  const n = String(client || "").trim().toLowerCase(); if (!n) return "";
  const hit = x => String(x.client || x.name || "").trim().toLowerCase() === n;
  const src = [...DATA.payments, ...DATA.members, ...allSignups()].find(x => x.instagram && hit(x));
  if (src) return cleanIG(src.instagram);
  const lead = allLeads().find(x => hit(x) && /^@|instagram\.com/i.test(x.contact || ""));
  return lead ? cleanIG(lead.contact) : "";
}
const igDM = h => "https://ig.me/m/" + encodeURIComponent(h);   // opens the Instagram chat with that account
function stripeUrl(p) {
  if (p.stripeUrl && /^https:\/\/dashboard\.stripe\.com\//.test(p.stripeUrl)) return p.stripeUrl;
  if (/^(pi|ch|py)_[A-Za-z0-9]+$/.test(p.id || "")) return "https://dashboard.stripe.com/payments/" + p.id;
  if (/^in_[A-Za-z0-9]+$/.test(p.id || "")) return "https://dashboard.stripe.com/invoices/" + p.id;
  return "";
}
const slackUrl = s => s.permalink && /^https:\/\/[a-z0-9-]+\.slack\.com\//i.test(s.permalink) ? s.permalink : "";
/* Link to a client's Instagram DMs. With sample data the handles aren't real, so it shows where it would go instead. */
function igLink(client, label) {
  const h = igFor(client);
  if (!igOk(h)) return `<span class="muted">No IG handle</span>`;
  if (DATA.meta?.sample) return `<button type="button" class="ig" data-igsample="${esc(h)}" data-client="${esc(client)}">${esc(label || "@" + h)}</button>`;
  return `<a class="ig" href="${igDM(h)}" target="_blank" rel="noopener noreferrer">${esc(label || "@" + h)} ↗</a>`;
}

/* ---------- access codes ---------- */
function sha256Fallback(str) {
  const K = [], H = [];
  let n = 2, c = 0;
  const frac = x => (x - Math.floor(x)) * 4294967296 | 0;
  while (c < 64) { let prime = true; for (let i = 2; i * i <= n; i++) if (n % i === 0) { prime = false; break; } if (prime) { if (c < 8) H[c] = frac(Math.pow(n, 1 / 2)); K[c++] = frac(Math.pow(n, 1 / 3)); } n++; }
  const bytes = [...new TextEncoder().encode(str)], len = bytes.length * 8;
  bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (len >>> (i * 8)) & 255);
  const r = (x, k) => (x >>> k) | (x << (32 - k)), w = new Array(64);
  for (let o = 0; o < bytes.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
    for (let i = 16; i < 64; i++) { const s0 = r(w[i - 15], 7) ^ r(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = r(w[i - 2], 17) ^ r(w[i - 2], 19) ^ (w[i - 2] >>> 10); w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0; }
    let [a, b, cc, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & cc) ^ (b & cc))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = cc; cc = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, cc, d, e, f, g, h].forEach((v, i) => H[i] = (H[i] + v) | 0);
  }
  return H.map(v => (v >>> 0).toString(16).padStart(8, "0")).join("");
}
async function hashCode(code) {
  const norm = String(code || "").replace(/[\s-]+/g, "").toUpperCase();
  try {
    if (crypto?.subtle) { const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(norm)); return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join(""); }
  } catch {}
  return sha256Fallback(norm);
}
window.hashCode = hashCode;

/* ---------- session ---------- */
function currentUser() {
  try {
    const s = JSON.parse(localStorage.getItem(SESSION_KEY));
    return s && ACCESS.some(a => a.role === s.role) && s.name ? { name: String(s.name).slice(0, 60), role: s.role } : null;
  } catch { return null; }
}
const isAdmin = () => state.user?.role === "admin";
/* Which tabs each role sees */
const ROLE_TABS = { admin: null, outreach: ["bookings"], coach: ["checkins"] };
const ROLE_LABEL = { admin: "Admin", outreach: "Outreach", coach: "Coach" };

/* ---------- sample data (used only when data.json is missing) ---------- */
const SAMPLE_COACHES = COACHES;
function buildSample() {
  let seed = 42;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const start = addDays(mondayOf(today), -7 * 52);
  const first = ["Alex","Jordan","Sam","Taylor","Casey","Morgan","Riley","Jamie","Drew","Avery","Quinn","Harper","Rowan","Blake","Reese","Emerson","Sky","Hayden","Parker","Kai"];
  const last = ["A.","B.","C.","D.","F.","G.","H.","K.","L.","M.","N.","P.","R.","S.","T.","W."];
  const programs = ["12-Week Transformation","Strength Foundations","Online Coaching","Body Recomp","Hybrid PT","Black Friday 12-Week Online","6-Week Challenge"];
  const progWeeks = { "12-Week Transformation": 12, "Strength Foundations": 8, "Online Coaching": 12, "Body Recomp": 16, "Hybrid PT": 12, "Black Friday 12-Week Online": 12, "6-Week Challenge": 6 };
  const progType = p => /Online/.test(p) ? "Online program" : /Challenge/.test(p) ? "Challenge" : "Custom program";

let DATA = null;
const state = {
  tab: "overview",
  periodType: store().periodType || "month",

};

];
/* The account filter only applies on Overview */

/* ---------- periods ---------- */
function periodRange(type, key) {
  if (type === "week") { const s = parse(key); return [s, addDays(s, 7)]; }
  if (type === "month") { const [y, m] = key.split("-").map(Number); return [new Date(y, m - 1, 1), new Date(y, m, 1)]; }
  const y = Number(key); return [new Date(y, 0, 1), new Date(y + 1, 0, 1)];
}
function periodKeyOf(type, d) {
  if (type === "week") return iso(mondayOf(d));
  if (type === "month") return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  return String(d.getFullYear());
}
function prevKey(type, key) {
  const [s] = periodRange(type, key);
  return periodKeyOf(type, type === "week" ? addDays(s, -7) : type === "month" ? new Date(s.getFullYear(), s.getMonth() - 1, 1) : new Date(s.getFullYear() - 1, 0, 1));
}
function periodLabel(type, key) {
  const [s, e] = periodRange(type, key);
  if (type === "week") return `Week of ${dShort(s)} – ${dShort(addDays(e, -1))} ${s.getFullYear()}`;
  if (type === "month") return s.toLocaleDateString("en-AU", { month: "long", year: "numeric" });
  return key;
}
function periodKeys(type) {
  const dates = DATA.payments.map(p => p.date).sort();
  const first = dates.length ? parse(dates[0]) : new Date();
  const keys = []; let k = periodKeyOf(type, new Date());
  const stop = periodKeyOf(type, first);
  for (let i = 0; i < 120; i++) { keys.push(k); if (k === stop) break; k = prevKey(type, k); }
  return keys;
}
const inRange = (dateStr, [s, e]) => { const d = parse(dateStr); return d >= s && d < e; };
/* If the selected period is still running, compare with the same number of days of the previous period */
function prevRange() {
  const cur = periodRange(state.periodType, state.periodKey);
  const prev = periodRange(state.periodType, prevKey(state.periodType, state.periodKey));
  const tomorrow = addDays(new Date(new Date().setHours(0, 0, 0, 0)), 1);
  if (tomorrow >= cur[1]) return prev;
  const days = Math.round((tomorrow - cur[0]) / 864e5);
  const e = addDays(prev[0], days);
  return [prev[0], e < prev[1] ? e : prev[1]];
}
function isRunning() { return addDays(new Date(new Date().setHours(0, 0, 0, 0)), 1) < periodRange(state.periodType, state.periodKey)[1]; }
const lastDay = range => { const t = addDays(new Date(new Date().setHours(0, 0, 0, 0)), 1); return addDays(range[1] < t ? range[1] : t, -1); };

/* ---------- metrics ---------- */
const byAccount = p => acct() === "all" || p.account === acct();
function paymentsIn(range, { status = "collected", account = true } = {}) {
  return DATA.payments.filter(p => inRange(p.date, range) && (status === "any" || p.status === status) && (!account || byAccount(p)));
}
function revenue(range) { return sum(paymentsIn(range), p => p.amount); }
function feeIncome(range) {
  const f = DATA.fees.filter(x => inRange(x.date, range) && (acct() === "all" || x.gym === acct()));
  const gross = sum(f, x => x.amount), waived = sum(f.filter(x => x.waived), x => x.amount);
  return { gross, waived, net: gross - waived, late: f.filter(x => x.type === "late_cancel" && !x.waived).length, noshow: f.filter(x => x.type === "no_show" && !x.waived).length, rows: f };
}
function adSpend(range, channel) { return sum(DATA.adSpend.filter(a => inRange(a.weekStart, range) && (!channel || a.channel === channel)), a => a.amount); }
/* Funnel = weekly tracker history (funnel[]) + leads and calls entered by hand.
   Closes always come from sign-ups entered by hand. Calls booked count on the day
   they were booked; show-ups, no-shows and cancellations on the day of the call. */
function funnelIn(range) {
  const rows = DATA.funnel.filter(f => inRange(f.weekStart, range));
  const calls = allCalls();
  const held = calls.filter(c => c.callDate && inRange(c.callDate, range));
  const st = s => held.filter(c => c.status === s).length;
  return {
    leads: sum(rows, r => r.leads) + allLeads().filter(l => inRange(l.date, range)).length,
    booked: sum(rows, r => r.booked) + calls.filter(c => inRange(c.bookedOn, range)).length,
    showed: sum(rows, r => r.showed) + st("showed") + st("closed"),
    noShows: sum(rows, r => r.noShows) + st("no_show"),
    cancellations: sum(rows, r => r.cancellations) + st("cancelled"),
    closes: allSignups().filter(s => inRange(s.date, range)).length
  };
}
const signupsIn = range => allSignups().filter(s => inRange(s.date, range) && byAccount(s));
function recurringFortnightly() {
  return sum(DATA.members.filter(m => m.status === "active" && !m.upfront && (acct() === "all" || m.homeGym === acct())), m => m.price);
}
function churn() {
  const ms = DATA.members.filter(m => acct() === "all" || m.homeGym === acct());
  const susp = ms.filter(m => m.status === "suspended"), term = ms.filter(m => m.status === "terminated");
  const lost = m => m.upfront ? 0 : (m.suspensionWeeks / 2) * m.price;
  return { susp, term, lostCash: sum(susp, lost), lost };
}
function goalFor(monthKey) { const g = DATA.goals && DATA.goals.monthlyRevenue && DATA.goals.monthlyRevenue[monthKey]; return g == null ? null : Number(g); }
function delta(cur, prev, { money = true, upGood = true } = {}) {
  if (!prev) return `<span class="muted">No data for previous period</span>`;
  const d = cur - prev, p = (d / prev) * 100;
  const good = upGood ? d >= 0 : d <= 0;
  const sign = d >= 0 ? "▲" : "▼";
  return `<span class="${good ? "up" : "down"}">${sign} ${Math.abs(p).toFixed(1)}%</span> <span class="muted">vs ${money ? compact(prev) : prev} ${isRunning() ? "same point last period" : "previous period"}</span>`;
}
function notifications() {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const in14 = addDays(today, 14);
  const upcoming = DATA.payments.filter(p => p.status === "scheduled" && parse(p.date) <= in14 && byAccount(p)).sort((a, b) => a.date.localeCompare(b.date));
  const uncollected = DATA.payments.filter(p => p.status === "outstanding" && byAccount(p)).sort((a, b) => b.date.localeCompare(a.date));
  const transfers = DATA.payments.filter(p => p.transfer && !p.transfer.confirmed && p.status === "collected");
  const key = x => (x.client + "|" + x.date + "|" + Math.round(x.amount)).toLowerCase();
  const firstPays = DATA.payments.filter(p => p.kind === "custom" && (p.instalment || 1) === 1 && p.status === "collected" && parse(p.date) >= addDays(today, -60));
  const slackKeys = new Set(DATA.slackPosts.map(key));
  const payKeys = new Set(firstPays.map(key));
  const noSlack = firstPays.filter(p => !slackKeys.has(key(p)));
  const noStripe = DATA.slackPosts.filter(s => parse(s.date) >= addDays(today, -60) && !payKeys.has(key(s)));
  const needDetails = DATA.offers.filter(o => !o.confirmed || !o.paymentType || !o.billing);
  return { upcoming, uncollected, transfers, noSlack, noStripe, needDetails };
}

/* ---------- charts ---------- */
const tip = $("#tip");
function showTip(html, ev) { tip.innerHTML = html; tip.style.display = "block"; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; }
function bindTips(root) {
  root.querySelectorAll("[data-tip]").forEach(el => {
    el.addEventListener("mouseenter", e => showTip(el.getAttribute("data-tip"), e));
    el.addEventListener("mousemove", moveTip);
    el.addEventListener("mouseleave", hideTip);
    el.addEventListener("focus", () => { const b = el.getBoundingClientRect(); showTip(el.getAttribute("data-tip"), { clientX: b.right, clientY: b.top }); });
    el.addEventListener("blur", hideTip);
  });
}
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function tickFmt(v, money) { if (!money) return v.toLocaleString("en-AU"); return v >= 10000 ? "$" + Math.round(v / 1000) + "K" : "$" + v.toLocaleString("en-AU"); }

/* Stacked columns: rows = [{label, sub, values:{key:n}}], series = [{key,name,color}] */
function stackedColumns(rows, series, { height = 240, money = true, highlight = -1, width = 760 } = {}) {
  const W = width, H = height, L = 52, R = 8, T = 10, B = 28;
  const totals = rows.map(r => sum(series, s => r.values[s.key] || 0));
  let step = niceMax(Math.max(...totals, 0) / 4);
  if (!money) step = Math.max(1, Math.ceil(step));
  const max = step * 4;
  const band = (W - L - R) / rows.length, bw = Math.min(24, band * 0.62);
  const y = v => T + (H - T - B) * (1 - v / max);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = (max / 4) * i, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${i ? "var(--grid)" : "var(--axis)"}" stroke-width="1"/>`;
    g += `<text x="${L - 8}" y="${yy + 4}" text-anchor="end">${tickFmt(v, money)}</text>`;
  }
  const every = Math.ceil(rows.length / 12);
  rows.forEach((r, i) => {
    const x = L + band * i + (band - bw) / 2;
    let base = 0; const segs = [];
    series.forEach(s => { const v = r.values[s.key] || 0; if (v > 0) segs.push({ s, v, y0: base, y1: base + v }); base += v; });
    segs.forEach((sg, j) => {
      const top = y(sg.y1), bot = y(sg.y0);
      const gap = j > 0 ? 2 : 0;
      const h = Math.max(0, bot - top - gap);
      const last = j === segs.length - 1;
      const rr = last ? Math.min(4, h, bw / 2) : 0;
      const op = highlight >= 0 && highlight !== i ? 0.45 : 1;
      g += last
        ? `<path d="M${x},${top + h} V${top + rr} Q${x},${top} ${x + rr},${top} H${x + bw - rr} Q${x + bw},${top} ${x + bw},${top + rr} V${top + h} Z" fill="${sg.s.color}" opacity="${op}"/>`
        : `<rect x="${x}" y="${top}" width="${bw}" height="${h}" fill="${sg.s.color}" opacity="${op}"/>`;
    });
    if (i % every === 0 || i === rows.length - 1) g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${esc(r.label)}</text>`;
    const tipHtml = `<div class="t" style="font-weight:600;margin-bottom:4px">${esc(r.sub || r.label)}</div>` +
      series.map(s => `<div class="tr"><span><span class="dot" style="background:${s.color}"></span> ${esc(s.name)}</span><span>${money ? aud(r.values[s.key] || 0) : (r.values[s.key] || 0)}</span></div>`).join("") +
      `<div class="tr" style="border-top:1px solid var(--grid);margin-top:4px;padding-top:4px"><span>Total</span><span>${money ? aud(totals[i]) : totals[i]}</span></div>`;
    g += `<rect x="${L + band * i}" y="${T}" width="${band}" height="${H - T - B}" fill="transparent" tabindex="0" data-tip="${esc(tipHtml)}"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Stacked column chart">${g}</svg>`;
}

/* Horizontal bars: items = [{label, value, color, note}] */
function hbars(items, { money = false, max = null } = {}) {
  const m = max ?? Math.max(...items.map(i => i.value), 1);
  return `<div style="display:grid;gap:10px">` + items.map(it => {
    const w = Math.max(0, (it.value / m) * 100);
    const tipHtml = `<div style="font-weight:600">${esc(it.label)}</div><div class="tr"><span>Value</span><span>${money ? aud(it.value) : it.value.toLocaleString("en-AU")}</span></div>${it.note ? `<div class="muted">${esc(it.note)}</div>` : ""}`;
    return `<div tabindex="0" data-tip="${esc(tipHtml)}">
      <div class="row" style="justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span>${esc(it.label)}</span><span style="font-variant-numeric:tabular-nums;font-weight:600">${it.display ?? (money ? aud(it.value) : it.value.toLocaleString("en-AU"))}${it.note ? ` <span class="muted" style="font-weight:400">${esc(it.note)}</span>` : ""}</span></div>
      <div style="height:14px;background:var(--wash);border-radius:0 4px 4px 0"><div style="height:100%;width:${w}%;background:${it.color};border-radius:0 4px 4px 0"></div></div>
    </div>`;
  }).join("") + `</div>`;
}
const legend = series => `<div class="legend">${series.map(s => `<span><span class="dot" style="background:${s.color}"></span>${esc(s.name)}</span>`).join("")}</div>`;
const tile = (label, value, d = "", extra = "") => `<div class="card tile"><div class="label">${label}</div><div class="value">${value}</div><div class="delta">${d}</div>${extra}</div>`;
function tableView(head, rows, numCols = []) {
  return `<details class="tv"><summary>Show as table</summary><div class="table-wrap"><table><thead><tr>${head.map((h, i) => `<th class="${numCols.includes(i) ? "num" : ""}">${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${numCols.includes(i) ? "num" : ""}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></details>`;
}
function accountSeries() { return (state.account === "all" ? ACCOUNTS : [ACC[state.account]]).map(a => ({ key: a.id, name: a.short, color: a.color })); }

/* Weekly revenue rows for the last n weeks ending in the selected period */
function weeklyRows(n) {
  let w = mondayOf(lastDay(periodRange(state.periodType, state.periodKey)));
  const rows = [];
  for (let i = 0; i < n; i++) {
    const r = [w, addDays(w, 7)];
    const values = {};
    ACCOUNTS.forEach(a => values[a.id] = sum(DATA.payments.filter(p => p.status === "collected" && p.account === a.id && inRange(p.date, r) && byAccount(p)), p => p.amount));
    rows.unshift({ label: dShort(w), sub: `Week of ${dShort(w)} ${w.getFullYear()}`, values, range: r });
    w = addDays(w, -7);
  }
  return rows;
}
function monthlyRows(n) {
  const rows = []; let k = periodKeyOf("month", addDays(periodRange(state.periodType, state.periodKey)[1], -1));
  for (let i = 0; i < n; i++) {
    const r = periodRange("month", k);
    const values = {};
    ACCOUNTS.forEach(a => values[a.id] = sum(DATA.payments.filter(p => p.status === "collected" && p.account === a.id && inRange(p.date, r) && byAccount(p)), p => p.amount));
    rows.unshift({ key: k, label: r[0].toLocaleDateString("en-AU", { month: "short" }), sub: periodLabel("month", k), values, range: r });
    k = prevKey("month", k);
  }
  return rows;
}

function roasCard(range) {
  const gymRev = sum(paymentsIn(range, { account: false }).filter(p => p.account !== "online"), p => p.amount);
  const onRev = sum(paymentsIn(range, { account: false }).filter(p => p.account === "online"), p => p.amount);
  const gSpend = adSpend(range, "gyms"), oSpend = adSpend(range, "online");
  return `<div class="card"><h2>Return on ad spend (ROAS)</h2><p class="hint">Collected revenue ÷ Meta ad spend, ${esc(periodLabel(state.periodType, state.periodKey))}.</p>
    <div class="table-wrap"><table data-title="ROAS"><thead><tr><th>Channel</th><th class="num">Revenue</th><th class="num">Ad spend</th><th class="num">ROAS</th></tr></thead><tbody>
      <tr><td>Gyms (Claremont + Jolimont)</td><td class="num">${aud(gymRev)}</td><td class="num">${aud(gSpend)}</td><td class="num">${gSpend ? (gymRev / gSpend).toFixed(1) + "×" : "–"}</td></tr>
      <tr><td>Online</td><td class="num">${aud(onRev)}</td><td class="num">${aud(oSpend)}</td><td class="num">${oSpend ? (onRev / oSpend).toFixed(1) + "×" : "–"}</td></tr>
    </tbody></table></div></div>`;
}
function sameDays(type, key) {
  const cur = periodRange(type, key), prev = periodRange(type, prevKey(type, key));
  const days = Math.round((addDays(new Date(new Date().setHours(0, 0, 0, 0)), 1) - cur[0]) / 864e5);
  const e = addDays(prev[0], days); return [prev[0], e < prev[1] ? e : prev[1]];
}
function comparisonCard() {
  const today = new Date();
  const wk = periodKeyOf("week", today), mo = periodKeyOf("month", today);
  const rows = [
    ["This week vs last week (to the same day)", periodRange("week", wk), sameDays("week", wk)],
    ["This month vs last month (to the same day)", periodRange("month", mo), sameDays("month", mo)]
  ].map(([label, a, b]) => {
    const ra = revenue(a), rb = revenue(b), fa = funnelIn(a), fb = funnelIn(b);
    return `<tr><td>${label}</td><td class="num">${aud(ra)}</td><td class="num">${aud(rb)}</td><td class="num">${rb ? `<span class="${ra >= rb ? "up" : "down"}">${ra >= rb ? "▲" : "▼"} ${Math.abs(((ra - rb) / rb) * 100).toFixed(1)}%</span>` : "–"}</td><td class="num">${fa.booked} / ${fb.booked}</td><td class="num">${fa.closes} / ${fb.closes}</td></tr>`;
  }).join("");
  return `<div class="card"><h2>Week-on-week and month-on-month</h2><p class="hint">Always uses the current week and month, whatever period is selected above.</p>
  <div class="table-wrap"><table><thead><tr><th>Comparison</th><th class="num">Sales now</th><th class="num">Sales before</th><th class="num">Change</th><th class="num">Calls booked (now / before)</th><th class="num">Closes (now / before)</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}

};
const STALE_DAYS = 14;
const PROGRAM_ACTIVE_DAYS = 182;   // a program client counts as current for ~6 months after their start date, until program end dates come from Coach Vault
const DAY_NAMES = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
const today0 = () => { const t = new Date(); t.setHours(0, 0, 0, 0); return t; };
const dayFmt = d => d ? `${dShort(parse(d))} ${parse(d).getFullYear()}` : "–";

const coaches = () => COACHES.slice();

/* ---------- notifications (own tab) ---------- */
function pulseLatest() {
  const all = [...DATA.pulse, ...entries().pulse].sort((a, b) => String(a.at).localeCompare(String(b.at)));
  const m = new Map(); all.forEach(p => m.set(p.clientKey, p)); return m;
}
function checkinClients() {
  const latest = pulseLatest();
  const recent = iso(addDays(today0(), -PROGRAM_ACTIVE_DAYS));
  return allClients().filter(c => c.status === "active").map(c => {
    const p = latest.get(c.key);
    const coach = c.member?.coach || c.signups.find(s => s.coach)?.coach || "";
    const start = c.member?.since || c.signups[0]?.start || c.since || "";
    const monthly = c.member && !c.member.upfront ? c.member.price * 26 / 12 : 0;
    const age = p ? daysBetween(new Date(p.at), new Date()) : null;
    const current = c.member ? c.member.status === "active" : c.signups.some(s => (s.start || s.date) >= recent) || c.programs.some(x => x.created >= recent);
    return { ...c, coach, start, monthly, current, pulse: p ? p.status : "not_set", pulseNote: p?.note || "", meetingNote: p?.meetingNote || "", pulseAt: p?.at || "", pulseBy: p?.by || "", age, stale: age == null || age > STALE_DAYS };
  }).filter(c => c.coach && c.current);
}
function notifGroups() {
  const n = notifications();
  const dueSoon = sum(n.upcoming, p => p.amount);
  const out = [];
  const go = (target, txt) => `<button type="button" class="n-item" data-go="${target}"><span class="txt">${txt}</span><span class="go" aria-hidden="true">→</span></button>`;
  const ext = (url, txt) => `<a class="n-item" href="${esc(url)}" target="_blank" rel="noopener noreferrer"><span class="txt">${txt}</span><span class="go" aria-hidden="true">↗</span></a>`;
  const group = (cls, ico, title, count, target, items, more = "") => out.push(`<div class="notif ${cls}"><div class="ico" aria-hidden="true">${ico}</div><div style="flex:1;min-width:0">
    <button type="button" class="n-head" data-go="${target}">${title} <span class="count">${count}</span> <span aria-hidden="true">→</span></button>
    <div>${items.join("")}${more}</div></div></div>`);
  const payItem = p => {
    const txt = `${esc(p.client)} · ${aud(p.amount, 2)} due ${dShort(parse(p.date))}`;
    const h = igFor(p.client);
    if (!igOk(h)) return go("overview:r-outstanding", txt + ` <span class="muted">· no IG handle</span>`);
    if (DATA.meta?.sample) return `<button type="button" class="n-item" data-igsample="${esc(h)}" data-client="${esc(p.client)}"><span class="txt">${txt} · @${esc(h)}</span><span class="go" aria-hidden="true">↗</span></button>`;
    return ext(igDM(h), txt + ` · @${esc(h)}`);
  };
  if (n.uncollected.length) group("n-payment", "!", "Payments not yet collected", n.uncollected.length, "overview:r-outstanding",
    n.uncollected.slice(0, 3).map(payItem), n.uncollected.length > 3 ? go("overview:r-outstanding", `+${n.uncollected.length - 3} more`) : "");
  const risk = checkinClients().filter(c => c.pulse === "at_risk");
  if (risk.length) group("n-risk", "●", "Clients at risk", risk.length, "checkins:at_risk",
    risk.slice(0, 3).map(c => go("checkins:at_risk", `${esc(c.name)}${c.coach ? ` · ${esc(c.coach)}` : ""}${c.pulseNote ? ` · ${esc(c.pulseNote.slice(0, 60))}${c.pulseNote.length > 60 ? "…" : ""}` : ""}`)),
    risk.length > 3 ? go("checkins:at_risk", `+${risk.length - 3} more`) : "");
  if (n.noStripe.length || n.noSlack.length) group("n-slack", "≠", "Slack and Stripe mismatches", n.noStripe.length + n.noSlack.length, "overview:r-mismatch", [
    ...n.noStripe.slice(0, 2).map(s => { const t = `Slack post, no Stripe payment: ${esc(s.client)} ${aud(s.amount)} (${dShort(parse(s.date))})`; const u = slackUrl(s); return u ? ext(u, t) : go("overview:r-mismatch", t); }),
    ...n.noSlack.slice(0, 2).map(p => { const t = `Stripe payment, no Slack post: ${esc(p.client)} ${aud(p.amount)} (${dShort(parse(p.date))})`; const u = stripeUrl(p); return u ? ext(u, t) : go("overview:r-mismatch", t); })]);
  if (n.transfers.length) group("n-transfer", "⇄", "Transfers between accounts waiting", n.transfers.length, "overview:r-transfers",
    n.transfers.slice(0, 3).map(p => go("overview:r-transfers", `${esc(p.client)} · ${aud(p.amount)} Online → ${esc(ACC[p.transfer.to]?.short || "?")}${p.transfer.onList ? "" : " · not on Sheila's list"} · needs accounting confirmation`)));
  if (n.upcoming.length) group("n-upcoming", "↻", "Upcoming collections, next 14 days", n.upcoming.length, "overview:r-upcoming",
    [`<div class="n-item" style="cursor:default">${aud(dueSoon)} due</div>`, ...n.upcoming.slice(0, 3).map(p => go("overview:r-upcoming", `${esc(p.client)} ${aud(p.amount)} on ${dShort(parse(p.date))}`))]);
  const chg = upcomingChanges(CHANGE_WINDOW_DAYS);
  if (chg.length) group("n-change", "‖", `Terminations, pauses and program endings, next ${CHANGE_WINDOW_DAYS} days`, chg.length, "memberships:m-upcoming",
    chg.slice(0, 4).map(c => c.type === "program_end" ? go("memberships:m-ending", `${esc(c.member)} · <strong>Program ending on ${dShort(parse(c.start))}</strong>`) : go(c.type === "termination" ? "memberships:m-termnotice" : "memberships:m-suspended", `${esc(c.member)} · <strong>${CHANGE_LABEL[c.type] || esc(c.type)}</strong> from ${dShort(parse(c.start))}${c.type !== "termination" ? ` · ${esc(changeLength(c))}` : ""}${c.m?.since ? ` · member ${tenure(c.m.since)}` : ""}`)),
    chg.length > 4 ? go("memberships:m-upcoming", `+${chg.length - 4} more`) : "");
  const ready = readyForRyan();
  if (ready.length) group("n-ready", "✓", "Ready for Ryan: meal plan and protocol done", ready.length, "memberships:m-onboarding",
    ready.slice(0, 4).map(s => go("memberships:m-onboarding", `${esc(s.client)} · ${esc(macroText(onboardOf(s.id).meal))}${s.coach ? ` · ${esc(s.coach)}` : ""}`)),
    ready.length > 4 ? go("memberships:m-onboarding", `+${ready.length - 4} more`) : "");
  const ending = programsEnding(0, CHANGE_WINDOW_DAYS);
  if (ending.length) group("n-change", "⏱", `Programs ending, next ${CHANGE_WINDOW_DAYS} days`, ending.length, "memberships:m-ending",
    ending.slice(0, 4).map(({ s, end }) => go("memberships:m-ending", `${esc(s.client)} · ${esc(s.program)} ends ${dShort(parse(end))}${s.coach ? ` · ${esc(s.coach)}` : ""}`)),
    ending.length > 4 ? go("memberships:m-ending", `+${ending.length - 4} more`) : "");
  if (n.needDetails.length) group("n-offer", "?", "Offers needing details or Ryan's confirmation", n.needDetails.length, "sales:todo",
    n.needDetails.slice(0, 3).map(o => go("sales:todo", esc(o.title))));
  return out;
}

/* ---------- Sales ---------- */
function salesTotals(range) {
  const inR = d => !range || (d && inRange(d, range));
  const leads = allLeads().filter(l => inR(l.date)), calls = allCalls().filter(c => inR(c.bookedOn || c.callDate)), sus = allSignups().filter(x => inR(x.date));
  const f = DATA.funnel.filter(r => inR(r.weekStart));
  return {
    leads: leads.length + sum(f, r => r.leads),
    booked: calls.length + sum(f, r => r.booked),
    showed: calls.filter(c => c.status === "showed" || c.status === "closed").length + sum(f, r => r.showed),
    converted: sus.length,
    revenue: sum(sus, s => s.cash)
  };
}
function bySource(range) {
  const inR = d => !range || (d && inRange(d, range));
  const leads = allLeads().filter(l => inR(l.date)), calls = allCalls().filter(c => inR(c.bookedOn || c.callDate)), sus = allSignups().filter(x => inR(x.date));
  const names = [...new Set([...LEAD_SOURCES, ...leads.map(sourceOf), ...calls.map(sourceOf), ...sus.map(sourceOf)])];
  return names.map(s => ({ s, leads: leads.filter(l => sourceOf(l) === s).length, calls: calls.filter(c => sourceOf(c) === s).length, signed: sus.filter(x => sourceOf(x) === s).length }))
    .filter(r => r.leads || r.calls || r.signed).sort((a, b) => b.leads - a.leads);
}
const SOURCE_COLORS = ["var(--serious)", "var(--warning)", "var(--n-slack)", "var(--axis)", "var(--good)", "var(--muted)", "var(--accent)", "var(--n-change)"];
function callsByMonth(n) {
  const calls = allCalls(), sus = allSignups(), rows = [];
  let k = periodKeyOf("month", new Date());
  for (let i = 0; i < n; i++) {
    const r = periodRange("month", k);

function submitForm(kind, fd) {
  const v = Object.fromEntries([...fd.entries()].map(([k, x]) => [k, String(x).trim()]));
  const err = m => { $("#formErr").textContent = m; };
  const okDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s);
  const e = entries(), me = state.user.name;
  if (kind === "lead") {
    if (!v.name) return err("Enter the lead's name.");
    if (!okDate(v.date)) return err("Enter a valid date.");
    e.leads.push({ id: uid("l"), date: v.date, name: v.name, contact: v.contact, source: v.source, interest: v.interest, notes: v.notes, addedBy: me });
  }
  if (kind === "call") {
    if (!v.leadName) return err("Enter the lead's name.");
    if (!okDate(v.callDate)) return err("Enter a valid call date.");
    if (!allLeads().some(l => l.name.toLowerCase() === v.leadName.toLowerCase()))
      e.leads.push({ id: uid("l"), date: todayIso(), name: v.leadName, contact: v.contact, source: v.source, interest: "Not sure yet", notes: "", addedBy: me });
    const known = allLeads().find(l => l.name.toLowerCase() === v.leadName.toLowerCase());
    e.calls.push({ id: uid("c"), leadName: v.leadName, contact: v.contact || known?.contact || "", source: known && !v.contact ? (known.source || v.source) : v.source, bookedOn: todayIso(), callDate: v.callDate, callTime: v.callTime, status: "booked", rescheduled: 0, reminded: false, notes: v.notes, bookedBy: me });
  }
  if (kind === "signup") {
    if (!v.client) return err("Enter the client's name.");
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) return err("Enter a valid email address.");
    if (!v.program) return err("Enter the program.");
    if (!okDate(v.date)) return err("Enter a valid sign-up date.");
    if (!okDate(v.start)) return err("Enter a valid start date.");
    const nInst = v.paymentType === "instalments" ? Number(v.instalments) : 0;
    if (v.paymentType === "instalments" && !(nInst >= 2 && nInst <= 24)) return err("Enter the number of instalments (2 to 24).");
    const total = Number(v.total), cash = Number(v.cash || 0);
    if (!(total > 0)) return err("Enter the contract value.");
    if (cash < 0 || cash > total) return err("The first payment must be between $0 and the contract value.");
    if (allSignups().some(s => (s.email || "").toLowerCase() === v.email.toLowerCase() && s.program.toLowerCase() === v.program.toLowerCase() && s.date === v.date))
      return err("This client already has a sign-up for this program on this date.");
    const ig = cleanIG(v.instagram);
    if (v.instagram && !igOk(ig)) return err("Enter a valid Instagram handle, e.g. @bbr.member");
    const weeks = v.weeks ? Math.round(Number(v.weeks)) : 0;
    if (v.weeks && !(weeks >= 1 && weeks <= 104)) return err("Enter the program length in weeks (1 to 104).");
    const vip = fd.get("vip") === "on", coach = vip ? "Ryan" : (COACHES.includes(v.coach) ? v.coach : "");
    e.signups.push({ id: uid("s"), date: v.date, start: v.start, coach, vip, weeks, instalments: nInst, confirmed: false, received: "", client: v.client, email: v.email.toLowerCase(), instagram: ig, program: v.program, offerType: v.offerType, account: v.account, total, cash, paymentType: v.paymentType, closedBy: v.closedBy, source: v.source, notes: v.notes, enteredBy: me });
  }
  if (kind === "change") {
    if (!v.member) return err("Enter the member's name.");
    if (v.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email)) return err("Enter a valid email address.");
    if (!okDate(v.start)) return err("Enter a valid start date.");
    if (!CHANGE_TYPES[v.type]) return err("Choose a type.");
    const end = NO_END(v.type) ? "" : v.end;
    if (end && (!okDate(end) || end <= v.start)) return err("The end date must be after the start date.");
    e.changes.push({ id: uid("x"), member: v.member, email: v.email.toLowerCase(), type: v.type, start: v.start, end, reason: v.reason, notes: v.notes, loggedBy: me, loggedOn: todayIso() });
  }
  saveEntries(e); closeModal(); render();
}

/* ---------- clients: one list built from members, custom-program payments and sign-ups ---------- */
const NOTE_KINDS = { update: "Update", change: "Change", payment: "Payment", other: "Other" };
function allClients() {
  const list = [], byEmail = new Map(), byName = new Map();
  /* Match by email first; fall back to name only when one side has no email, so two people with the same name stay separate */
  const find = (name, email) => {
    const e = email ? email.toLowerCase() : "";
    const byE = e && byEmail.get(e); if (byE) return byE;
    const byN = byName.get(String(name || "").trim().toLowerCase());
    return byN && (!e || !byN.email) ? byN : null;
  };
  const get = (name, email) => {
    let c = find(name, email);
    if (!c) {
      c = { key: email ? "e:" + email.toLowerCase() : "n:" + String(name).trim().toLowerCase(), name: String(name).trim(), email: "", instagram: "",
            homeGym: "", crossGym: false, member: null, programs: [], signups: [], since: "" };
      list.push(c); if (!byName.has(c.name.toLowerCase())) byName.set(c.name.toLowerCase(), c);
    }
    if (email && !c.email) { c.email = email.toLowerCase(); byEmail.set(c.email, c); }
    return c;
  };
  const earliest = (a, b) => !a ? b : !b ? a : a < b ? a : b;
  DATA.members.forEach(m => {
    const c = get(m.name, m.email); c.member = m; c.homeGym = c.homeGym || m.homeGym; c.crossGym = c.crossGym || !!m.crossGym;
    c.instagram = c.instagram || cleanIG(m.instagram); c.since = earliest(c.since, m.since);
  });
  // custom offers grouped by person + program, so instalment offers 1/2 and 2/2 become one contract
  const groups = new Map();
  DATA.offers.filter(o => o.kind === "custom").forEach(o => {
    const mm = o.title.match(NAME_RE); if (!mm) return;
    const k = mm[1].trim().toLowerCase() + "|" + mm[2].trim().toLowerCase();
    if (!groups.has(k)) groups.set(k, { person: mm[1].trim(), program: mm[2].trim(), offers: [] });
    groups.get(k).offers.push(o);
  });
  groups.forEach(g => {
    const c = get(g.person);
    const ids = new Set(g.offers.map(o => o.id));
    const payments = DATA.payments.filter(p => ids.has(p.offerId)).sort((a, b) => a.date.localeCompare(b.date));
    const o0 = g.offers[0];
    const contract = g.offers.length > 1 ? sum(g.offers, o => o.price) : Number(o0.price) || 0;
    c.programs.push({ program: g.program, offers: g.offers, account: o0.account, duration: o0.duration, paymentType: o0.paymentType, contract, payments, created: o0.created });
    c.homeGym = c.homeGym || o0.homeGym; c.crossGym = c.crossGym || !!o0.crossGym; c.since = earliest(c.since, o0.created);
    const ig = payments.find(p => p.instagram); if (ig) c.instagram = c.instagram || cleanIG(ig.instagram);
  });
  allSignups().forEach(s => {
    const c = get(s.client, s.email); c.signups.push(s); c.since = earliest(c.since, s.date);
    c.instagram = c.instagram || cleanIG(s.instagram);
    if (!c.homeGym && s.account !== "online") c.homeGym = s.account;
  });
  list.forEach(c => {
    const pays = c.programs.flatMap(p => p.payments);
    c.collected = sum(pays.filter(p => p.status === "collected"), p => p.amount);
    c.outstanding = sum(pays.filter(p => p.status === "outstanding"), p => p.amount);
    c.scheduled = sum(pays.filter(p => p.status === "scheduled"), p => p.amount);
    c.status = c.member ? c.member.status : "active";
    c.type = c.member && c.programs.length ? "Membership + program" : c.member ? "Gym membership"
      : c.programs.some(p => p.account === "online") || c.signups.some(s => s.offerType === "Online program") ? "Online / custom program" : "Custom program";
    c.offer = c.member ? (DATA.offers.find(o => o.id === c.member.offerId)?.title || c.member.offerId) : (c.programs[0]?.program || c.signups[0]?.program || "–");
  });
  return list;
}

/* ---------- Monday meeting ---------- */
function nextMeeting(now = Date.now()) {
  const p = new Date(now + MEETING.offsetMin * 6e4);                       // Perth wall-clock in UTC fields
  const todayStart = Date.UTC(p.getUTCFullYear(), p.getUTCMonth(), p.getUTCDate(), MEETING.hour, MEETING.minute) - MEETING.offsetMin * 6e4;
  let start = todayStart + ((MEETING.weekday - p.getUTCDay() + 7) % 7) * 864e5;
  if (start + MEETING.durationMin * 6e4 <= now) start += 7 * 864e5;
  const end = start + MEETING.durationMin * 6e4;
  const sameDay = new Date(start + MEETING.offsetMin * 6e4).getUTCDate() === p.getUTCDate() && start - now < 864e5;
  return { start, end, status: now >= start ? "live" : sameDay ? "today" : "later" };
}
function untilText(ms) {
  const m = Math.max(1, Math.round(ms / 6e4));
  if (m < 60) return `in ${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return `in ${h} h${r ? " " + r + " min" : ""}`;
  const d = Math.round(h / 24); return `in ${d} ${d === 1 ? "day" : "days"}`;
}
function meetingHtml() {
  const mt = nextMeeting(), now = Date.now();
  const fmt = (opts, tz) => new Intl.DateTimeFormat("en-AU", { ...opts, timeZone: tz }).format(new Date(mt.start));
  let when;
  try {
    when = fmt({ weekday: "long", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }, MEETING.tz) + " Perth time";
    const mine = Intl.DateTimeFormat().resolvedOptions().timeZone;
    if (-new Date().getTimezoneOffset() !== MEETING.offsetMin) when += ` (${fmt({ hour: "numeric", minute: "2-digit", weekday: "short" }, mine)} your time)`;
  } catch { when = "Mondays, 8:00 am Perth time"; }
  const title = mt.status === "live" ? `<span class="live-dot" aria-hidden="true"></span> ${MEETING.title} is on now`
    : mt.status === "today" ? `${MEETING.title} today <span class="m-tag">${untilText(mt.start - now)}</span>`
    : `Next ${MEETING.title.toLowerCase()} <span class="m-tag">${untilText(mt.start - now)}</span>`;
  const agenda = "Dashboard, sales, programs ending, revenue and sales activity.";
  return `<div class="meeting ${mt.status}" role="region" aria-label="Monday team meeting">
    <div class="m-ico" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="13" height="12" rx="1"/><path d="M15.5 10.5 21.5 7v10l-6-3.5"/></svg></div>
    <div class="m-body"><div class="m-title">${title}</div><div class="m-when">${esc(when)} · ${agenda}</div></div>
    <a class="btn primary" href="${esc(MEETING.url)}" target="_blank" rel="noopener noreferrer">Join Google Meet ↗</a>
  </div>`;
}
