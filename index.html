  document.querySelectorAll("#view [data-remind]").forEach(b => b.onclick = () => editCall(b.dataset.remind, { reminded: true, remindedBy: state.user.name, remindedAt: new Date().toISOString() }));
  document.querySelectorAll("#view [data-outcome]").forEach(b => b.onclick = () => editCall(b.dataset.id, { status: b.dataset.outcome }));
  document.querySelectorAll("#view [data-resched]").forEach(b => b.onclick = () => openReschedule(b.dataset.resched));
  document.querySelectorAll("#view [data-editpay]").forEach(b => b.onclick = () => openPayEdit(b.dataset.editpay));
  document.querySelectorAll("#view [data-pulse]").forEach(b => b.onclick = () => openPulse(b.dataset.pulse));
  document.querySelectorAll("#view [data-ckrecv]").forEach(b => b.onclick = () => openCheckin(b.dataset.ckrecv));
  document.querySelectorAll("#view [data-ob]").forEach(b => b.onclick = () => openOnboard(b.dataset.ob, b.dataset.step));
  document.querySelectorAll("#view [data-ckview]").forEach(b => b.onclick = () => { save({ ckView: b.dataset.ckview }); render(); });
  document.querySelectorAll("#view [data-ckfilter]").forEach(b => b.onclick = () => { const cur = store().ckStatus; save({ ckStatus: cur === b.dataset.ckfilter ? "all" : b.dataset.ckfilter }); render(); });
  document.querySelectorAll("#view [data-ckfilter-age]").forEach(b => b.onclick = () => { save({ ckAge: b.dataset.ckfilterAge }); render(); });
  document.querySelectorAll("#view .pc-toggle").forEach(b => b.onclick = () => { const tb = b.closest("tbody"); const open = tb.dataset.open !== "true"; tb.dataset.open = String(open); b.setAttribute("aria-expanded", String(open)); });
  document.querySelectorAll("#view [data-clientname]").forEach(b => b.onclick = () => { const c = allClients().find(x => x.name.toLowerCase() === b.dataset.clientname.toLowerCase()); if (c) openClient(c.key); });
  document.querySelectorAll("[data-callstatus]").forEach(sel => sel.onchange = () => {
    const e = entries(); const id = sel.dataset.callstatus;
    const local = e.calls.find(c => c.id === id);
    if (local) local.status = sel.value; else e.callStatus[id] = sel.value;
    saveEntries(e); render();
  });
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    if (!isAdmin()) return;
    const kind = b.dataset.del, id = b.dataset.id, e = entries();
    e[kind] = e[kind].filter(x => x.id !== id); saveEntries(e); render();
  });
}
function bindView() {
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };
  on("#memberQ", "input", e => { save({ memberQ: e.target.value }); rerenderKeepFocus("#memberQ"); });
  on("#memberStatus", "change", e => { save({ memberStatus: e.target.value }); render(); });
  on("#clientType", "change", e => { save({ clientType: e.target.value }); render(); });
  on("#clientCoach", "change", e => { save({ clientCoach: e.target.value }); render(); });
  on("#salesMonths", "change", e => { save({ salesMonths: e.target.value }); render(); });
  on("#memSort", "change", e => { save({ memSort: e.target.value }); render(); });
  on("#ckCoach", "change", e => { save({ ckCoach: e.target.value }); render(); });
  on("#ckStatus", "change", e => { save({ ckStatus: e.target.value }); render(); });
  on("#ckAge", "change", e => { save({ ckAge: e.target.value }); render(); });
  on("#ckQ", "input", e => { save({ ckQ: e.target.value }); rerenderKeepFocus("#ckQ"); });
  document.querySelectorAll("#view tr.client-row").forEach(tr => tr.addEventListener("click", ev => { if (!ev.target.closest("a")) openClient(tr.dataset.client); }));
  on("#offerQ", "input", e => { save({ offerQ: e.target.value }); rerenderKeepFocus("#offerQ"); });
  on("#offerFilter", "change", e => { save({ offerFilter: e.target.value }); render(); });
  document.querySelectorAll("[data-offer]").forEach(cb => cb.addEventListener("change", () => { const o = store().offerActive || {}; o[cb.dataset.offer] = cb.checked; save({ offerActive: o }); }));
  // offer builder
  const readB = () => ({ ...(store().builder || {}), name: $("#bName").value, total: $("#bTotal").value, deposit: $("#bDeposit").value, count: $("#bCount").value, start: $("#bStart").value });
  ["#bName", "#bTotal", "#bDeposit", "#bCount", "#bStart"].forEach(id => on(id, "input", () => {
    save({ builder: readB() });
    if (id === "#bName") { const v = $("#bName").value; $("#bNameWarn").classList.toggle("hidden", !v || NAME_RE.test(v)); }
  }));
  on("#bMake", "click", () => {
    const b = readB(); const total = Number(b.total) || 0, n = Math.max(1, Math.min(24, Number(b.count) || 1));
    const dep = n === 1 ? total : Math.min(total, Number(b.deposit) || 0);
    const each = n > 1 ? Math.round(((total - dep) / (n - 1)) * 100) / 100 : 0;
    const start = b.start ? parse(b.start) : new Date();
    b.rows = Array.from({ length: n }, (_, i) => ({ amount: i === 0 ? dep : (i === n - 1 ? Math.round((total - dep - each * (n - 2)) * 100) / 100 : each), date: i === 0 ? iso(start) : "", collected: false, notes: i === 0 ? "Deposit" : "" }));
    save({ builder: b }); render(); $("#builder").scrollIntoView({ block: "nearest" });
  });
  on("#bClear", "click", () => { save({ builder: null }); render(); });
  on("#bExport", "click", async () => { const b = store().builder; try { await navigator.clipboard.writeText(JSON.stringify(b, null, 2)); $("#bExport").textContent = "Copied"; } catch { $("#bExport").textContent = "Copy failed"; } });
  document.querySelectorAll("#builder [data-row]").forEach(el => el.addEventListener("change", () => {
    const b = store().builder; const r = b.rows[Number(el.dataset.row)]; const f = el.dataset.f;
    r[f] = f === "collected" ? el.checked : f === "amount" ? Number(el.value) : el.value;
    save({ builder: b }); if (f === "amount") render();
  }));
}
function rerenderKeepFocus(sel) {
  const el = $(sel); const pos = el.selectionStart; render(); const n = $(sel); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch {} }
}
document.querySelectorAll("#periodType button").forEach(b => b.onclick = () => { state.periodType = b.dataset.v; state.periodKey = null; save({ periodType: state.periodType }); render(); });
$("#periodSel").onchange = e => { state.periodKey = e.target.value; render(); };
$("#accountSel").onchange = e => { state.account = e.target.value; render(); };
$("#themeBtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark"; document.documentElement.setAttribute("data-theme", next); save({ theme: next });
};
/* Full data file: everything the dashboard holds, in the data.json format (admins only) */
function exportJSON() {
  if (!isAdmin()) return;
  const out = { ...DATA, meta: { ...DATA.meta, exportedAt: new Date().toISOString(), exportedBy: state.user.name },
    leads: allLeads(), calls: allCalls(), signups: allSignups(), changes: allChanges().map(({ m, ...c }) => c), notes: [...DATA.notes, ...entries().notes], pulse: [...DATA.pulse, ...entries().pulse] };
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: "application/json" }));
  a.download = `bbr-data-${todayIso()}.json`;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

const exportBtn = $("#exportBtn"), exportMenu = $("#exportMenu");
function setMenu(open) { exportMenu.classList.toggle("hidden", !open); exportBtn.setAttribute("aria-expanded", open); if (open) exportMenu.querySelector("button").focus(); }
exportBtn.onclick = e => { e.stopPropagation(); setMenu(exportMenu.classList.contains("hidden")); };
exportMenu.querySelectorAll("[data-export]").forEach(b => b.onclick = () => { setMenu(false); const k = b.dataset.export; k === "pdf" ? exportPDF() : k === "json" ? exportJSON() : exportCSV(); });
document.addEventListener("click", e => { if (!exportMenu.contains(e.target)) setMenu(false); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!exportMenu.classList.contains("hidden")) { setMenu(false); exportBtn.focus(); }
  if (!$("#modal").classList.contains("hidden")) closeModal();
});
$("#modal").addEventListener("click", e => { if (e.target.id === "modal") closeModal(); });

function showLogin() {
  $("#userChip").innerHTML = "";
  state.user = null; $("#view").innerHTML = ""; $("#meetingSlot").innerHTML = ""; $("#login").classList.remove("hidden");
  $("#loginErr").textContent = ""; $("#loginCode").value = ""; $("#loginCode").type = "password";
  $("#toggleCode").innerHTML = EYE; $("#toggleCode").setAttribute("aria-label", "Show access code"); $("#toggleCode").setAttribute("aria-pressed", "false");
  let saved = ""; try { saved = localStorage.getItem(NAME_KEY) || ""; } catch {}
  $("#loginName").value = saved; (saved ? $("#loginCode") : $("#loginName")).focus();
}
function startSession(user) {
  state.user = user;
  $("#login").classList.add("hidden");
  const who = `${user.name} · ${ROLE_LABEL[user.role] || user.role}`;
  $("#userChip").setAttribute("aria-label", "Signed in as " + who);
  $("#userChip").innerHTML = `<span class="marquee" style="--dur:${Math.max(7, who.length * 0.45)}s" aria-hidden="true">${[0, 1, 2, 3].map(() => `<span>${esc(who)}</span>`).join("")}</span>`;
  $("#accountSel").classList.toggle("hidden", !isAdmin());
  document.querySelectorAll(".admin-only").forEach(el => el.classList.toggle("hidden", !isAdmin()));
  if (!isAdmin()) { state.account = "all"; $("#accountSel").value = "all"; }
  const h = location.hash.slice(1); const allow = ROLE_TABS[user.role];
  state.tab = TABS.find(t => t.id === h && (!allow || allow.includes(h))) ? h : (allow ? allow[0] : "overview");
  if (user.role === "admin" && nextMeeting().status !== "later") state.tab = "overview";   // Monday morning: Overview, with the orange dot on Notifications
  render();
}
let failed = 0, lockUntil = 0;
const EYE = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', EYE_OFF = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
$("#toggleCode").onclick = () => {
  const inp = $("#loginCode"), show = inp.type === "password";
  inp.type = show ? "text" : "password";
  $("#toggleCode").innerHTML = show ? EYE_OFF : EYE;
  $("#toggleCode").setAttribute("aria-label", show ? "Hide access code" : "Show access code");
  $("#toggleCode").setAttribute("aria-pressed", String(show));
  inp.focus();
};
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const err = m => { $("#loginErr").textContent = m; };
  if (Date.now() < lockUntil) return err(`Too many tries. Wait ${Math.ceil((lockUntil - Date.now()) / 1000)} seconds.`);
  const name = $("#loginName").value.trim().replace(/\s+/g, " ");
  if (!name) return err("Enter your name.");
  if (!$("#loginCode").value.trim()) return err("Enter your access code.");
  const h = await hashCode($("#loginCode").value);
  const match = ACCESS.find(a => a.hash === h);
  if (!match) {
    failed++; $("#loginCode").select();
    if (failed >= 5) { lockUntil = Date.now() + 30000; failed = 0; return err("Too many tries. Wait 30 seconds."); }
    return err("That access code isn't right.");
  }
  failed = 0;
  const user = { name: name.slice(0, 60), role: match.role };
  try { localStorage.setItem(SESSION_KEY, JSON.stringify(user)); localStorage.setItem(NAME_KEY, user.name); } catch {}
  startSession(user);
});
$("#logoutBtn").onclick = () => { try { localStorage.removeItem(SESSION_KEY); } catch {} showLogin(); };

async function init() {
  if (store().theme) document.documentElement.setAttribute("data-theme", store().theme);
  try {
    const r = await fetch("data.json", { cache: "no-store" });
    if (!r.ok) throw new Error("no data.json");
    DATA = await r.json();
  } catch { DATA = buildSample(); }
  DATA.goals = DATA.goals || { monthlyRevenue: {} };
  ["offers", "payments", "slackPosts", "members", "fees", "adSpend", "funnel", "leads", "calls", "signups", "changes", "notes", "pulse"].forEach(k => DATA[k] = DATA[k] || []);
  // Live clock in Perth time (AWST); the data refresh time stays in the tooltip
  const dataAt = new Date(DATA.meta?.generatedAt || Date.now()).toLocaleString("en-AU", { timeZone: "Australia/Perth", day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
  $("#asOf").title = `Live Perth time. Data last refreshed ${dataAt} (Perth).`;
  const tick = () => {
    try {
      $("#asOf").textContent = new Intl.DateTimeFormat("en-AU", { timeZone: "Australia/Perth", weekday: "short", day: "numeric", month: "short", year: "numeric",
        hour: "numeric", minute: "2-digit", second: "2-digit", timeZoneName: "short" }).format(new Date()).replace(" AWST", " AWST (Perth)");
    } catch { $("#asOf").textContent = new Date().toLocaleString("en-AU"); }
  };
  tick(); setInterval(tick, 1000);
  $("#accountSel").innerHTML += ACCOUNTS.map(a => `<option value="${a.id}">${a.name}</option>`).join("");
  const user = currentUser();
  if (user) startSession(user); else showLogin();
}
init();
</script>
